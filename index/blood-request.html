<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Blood Request - LifeLink</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/index/index.html"><span class="brand-mark">L</span>LifeLink</a>
    <button class="mobile-toggle" data-menu-toggle aria-label="Open navigation">&#9776;</button>
    <a class="nav-link" href="/index/dashboard.html">Dashboard</a>
    <a class="nav-link" href="/index/prediction.html">AI Prediction</a>
    <a class="nav-link active" href="/index/blood.html">Blood Donor</a>
    <a class="nav-link" href="/index/profile.html">My Profile</a>
    <a class="nav-link emergency-link" href="/index/ambulance.html">Emergency</a>
  </nav>

  <main class="page blood-request-page">
    <div class="container">
      <div class="profile-heading blood-request-heading">
        <span class="badge">Blood support</span>
        <h1>New Blood Request</h1>
        <p class="muted" id="request-intro">Share the patient details so the donor can review your request.</p>
      </div>
      <section class="form-card blood-request-card">
        <form id="blood-request-form" class="form-grid">
          <div class="field full"><label for="request-patient-name">Patient / requester name</label><input id="request-patient-name" type="text" required placeholder="Patient name"></div>
          <div class="field"><label for="request-blood-group">Blood group</label><select id="request-blood-group" required disabled><option value="">Select blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
          <div class="field"><label for="request-amount">Required blood amount</label><input id="request-amount" type="number" min="1" max="20" value="1" required></div>
          <div class="field"><label for="request-division">Division</label><select id="request-division" required><option value="">Select division</option><option>Barisal</option><option>Chattogram</option><option>Dhaka</option><option>Khulna</option><option>Mymensingh</option><option>Rajshahi</option><option>Rangpur</option><option>Sylhet</option></select></div>
          <div class="field"><label for="request-district">District</label><input id="request-district" type="text" required placeholder="District"></div>
          <div class="field"><label for="request-upazila">Upazila</label><input id="request-upazila" type="text" placeholder="Upazila"></div>
          <div class="field"><label for="request-time">Preferred time</label><input id="request-time" type="time" required></div>
          <div class="field full"><label for="request-address">Address</label><input id="request-address" type="text" placeholder="Hospital or complete address"></div>
          <div class="field"><label for="request-center">Donation center / hospital</label><input id="request-center" type="text" required placeholder="Hospital or donation center"></div>
          <div class="field"><label for="request-phone">Phone number</label><input id="request-phone" type="tel" required placeholder="01XXXXXXXXX"></div>
          <div class="field"><label for="request-whatsapp">WhatsApp number</label><input id="request-whatsapp" type="tel" placeholder="01XXXXXXXXX"></div>
          <div class="field"><label for="request-date">Required date</label><input id="request-date" type="date" required></div>
          <div class="field full"><label for="request-problem">Reason / emergency details</label><textarea id="request-problem" rows="3" placeholder="Describe the patient's condition or urgency"></textarea></div>
          <div class="donor-form-footer full"><p id="blood-request-message" class="profile-message" role="status"></p><button id="blood-request-submit" class="btn btn-primary" type="submit">Submit blood request</button></div>
        </form>
        <div id="blood-request-success" class="donor-success" hidden role="status"><div class="donor-success-mark" aria-hidden="true">&#10003;</div><h2>Blood request sent</h2><p>The donor has been notified. You can now contact them from the donor page.</p><a class="btn btn-primary" href="/index/blood.html">Back to blood donors</a></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/script.js"></script>
  <script src="/js/blood-request.js"></script>
</body>
</html>
