<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login — LifeLink</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">
                <a class="auth-logo" href="/index/index.html">
                    <span class="brand-mark">L</span>
                    <span>LifeLink</span>
                </a>
                <h1>Welcome back</h1>
                <p class="muted">Sign in to continue to LifeLink.</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="field"><label>Email</label><input id="login-email" type="email" required
                        placeholder="you@example.com"></div>
                <div class="field password-field">
    <label>Password</label>

    <div class="password-input-wrapper">
        <input
            id="login-password"
            type="password"
            required
            placeholder="••••••••">

        <button
            type="button"
            class="password-toggle"
            id="login-password-toggle"
            aria-label="Show password">
            👁
        </button>
    </div>
</div>
                <button class="btn btn-primary" type="submit">Sign In</button>
            </form>
            <div class="auth-divider"><span>or continue with</span></div>
            <button id="google-login-btn" class="btn google-login-btn" type="button">
                <span class="google-logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.45a5.51 5.51 0 0 1-2.39 3.61v3h3.87c2.27-2.09 3.56-5.17 3.56-8.64Z" />
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.87-3A7.18 7.18 0 0 1 12 19.2a7.82 7.82 0 0 1-7.35-5.42H.65v3.1A12 12 0 0 0 12 24Z" />
                        <path fill="#FBBC05" d="M4.65 13.78A7.2 7.2 0 0 1 4.27 12c0-.62.13-1.23.38-1.78v-3.1H.65A12 12 0 0 0 0 12c0 1.93.46 3.75 1.27 5.36l3.38-2.58Z" />
                        <path fill="#EA4335" d="M12 4.8c1.76 0 3.34.61 4.59 1.81l3.44-3.44C17.94 1.18 15.24 0 12 0A12 12 0 0 0 .65 7.12l3.99 3.1A7.82 7.82 0 0 1 12 4.8Z" />
                    </svg>
                </span>
                Continue with Google
            </button>
            <p class="muted" style="text-align:center;margin-top:18px">New to LifeLink? <a
                    style="color:var(--primary);font-weight:700" href="/index/signup.html">Create an account</a></p>
            <p style="text-align:center"><a class="muted" href="/index/index.html">← Back to home</a></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
