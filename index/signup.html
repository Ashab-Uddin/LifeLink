<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Account — LifeLink</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">
                <div class="brand-mark">L</div>
                <h1>Create your account</h1>
                <p class="muted">Start your connected health journey.</p>
            </div>
            <form id="signup-form" class="auth-form">
                <div class="field"><label>Full name</label><input required placeholder="Your name"></div>
                <div class="field"><label>Email</label><input id="signup-email" type="email" required
                        placeholder="you@example.com"></div>
                <div class="field"><label>Password</label><input type="password" required
                        placeholder="Create a password"></div><button class="btn btn-primary" type="submit">Create
                    Account</button>
            </form>
            <p class="muted" style="text-align:center;margin-top:18px">Already registered? <a
                    style="color:var(--primary);font-weight:700" href="/index/login.html">Sign in</a></p>
            <p style="text-align:center"><a class="muted" href="/index/index.html">← Back to home</a></p>
        </section>
    </main>
    <script src="/js/script.js"></script>
</body>

</html>
